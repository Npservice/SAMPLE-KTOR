# Jalankan:  docker compose up -d --build
# Seed:      docker compose run --rm app bin/seed
#
# Nilai diambil dari .env. Host & port database/Redis di bawah menimpa isi .env,
# karena di dalam jaringan compose service lain dipanggil lewat nama service-nya.

services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_DATABASE: ${DB_DATABASE:-example}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      LOG_DIR: /app/logs
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-example}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Lewat TCP: saat inisialisasi pertama, MySQL sementara hanya bisa diakses via socket,
      # jadi cek ini baru lolos setelah server yang sebenarnya siap.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  storage:
  mysql-data:
  redis-data:
